  }
  text { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .bg { fill: var(--surface); }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .sub { fill: var(--ink2); font-size: 12.5px; }
