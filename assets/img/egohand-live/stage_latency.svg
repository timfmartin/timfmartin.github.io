<title id="t">EgoHand time per frame by stage, before and after the optimisations</title>
<desc id="d">Two hands, profiled with CUDA synchronisation per stage. Crop preparation: 10.2 ms before, 2.1 ms after; DINOv3 backbone: 56.6 ms before, 26.4 ms after; Pose head: 12.7 ms before, 2.6 ms after; SOMA (shape fit, skinning): 24.8 ms before, 10.4 ms after; Rest of the forward pass: 11.4 ms before, 7.1 ms after.</desc>
<style>
