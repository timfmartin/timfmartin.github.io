# Source for both the CV page (/cv/) and the PDF that RenderCV builds from it
# (bin/render_cv.py, run by .github/workflows/render-cv.yml). `label` and `summary`
# are web-page fields; the script turns them into RenderCV's headline and a "Profile"
# section. Otherwise stick to field names both understand: `degree` for education,
# and `label`/`details` lines for skills, platforms and courses. `logo` (an image under
# assets/img/cv-logos/) is web-only too; the script drops it before rendering the PDF.
# Section titles matter on the web page: "Skills" expects name/keywords entries, so the
# label/details sections use other titles.
cv:
  name: Tim Martin
  label: Robotics AI Engineer
  location: Munich, Germany
  email: hello@timfmartin.dev
  website: https://timfmartin.dev
  photo: ../assets/img/prof_pic.jpg # PDF only, relative to this file
  summary: >-
    Robotics AI engineer focused on robot learning: teleoperation and data pipelines,
    fine-tuning and deploying vision-language-action models, imitation and reinforcement
    learning on humanoids, quadrupeds and robot arms. Background from end-to-end
    autonomous driving at Bosch to mobile manipulation at ESA.

  social_networks:
